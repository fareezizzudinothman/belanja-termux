<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Belanja" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <title>Dashboard &middot; Belanja</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
        <div class="page-sub" id="current-month-label">Loading&hellip;</div>
      </div>
      <div class="row-flex">
        <span class="badge" id="month-status-badge"></span>
        <a class="btn" href="/monthly.html">Open this month</a>
      </div>
    </div>

    <div class="grid cards" id="totals">
      <div class="card stat-card hero"><div class="label">Total Expenses</div><div class="value" id="t-total">&hellip;</div><div class="sub" id="t-month"></div></div>
      <div class="card stat-card"><div class="label">Fixed Expenses</div><div class="value" id="t-fixed">&hellip;</div><div class="sub" id="t-fixed-count"></div></div>
      <div class="card stat-card"><div class="label">Installments</div><div class="value" id="t-inst">&hellip;</div><div class="sub" id="t-inst-count"></div></div>
      <div class="card stat-card"><div class="label">Variable Expenses</div><div class="value" id="t-var">&hellip;</div><div class="sub" id="t-var-count"></div></div>
      <div class="card stat-card"><div class="label">Unpaid Installments</div><div class="value" id="t-unpaid">&hellip;</div><div class="sub" id="t-unpaid-count"></div></div>
    </div>

    <div class="grid cols-2">
      <div class="card" style="grid-column: 1 / -1;">
        <h2>Monthly Totals <span class="muted small" id="chart-range"></span></h2>
        <div class="chart-wrap" id="chart-wrap"><div class="chart" id="chart"></div></div>
        <div class="chart-legend">
          <span><span class="swatch" style="background:var(--brand);"></span>Total</span>
          <span class="muted">Hover bars for details</span>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row-flex justify-between" style="margin-bottom:12px;">
          <h2 style="margin:0;">Active Installments</h2>
          <a class="btn small" href="/installments.html">Manage</a>
        </div>
        <div id="installments-list"></div>
      </div>
    </div>
  </main>

  <script src="/js/ui.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Belanja" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <title>Variable Expenses &middot; Belanja</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Variable Expenses</h1>
        <div class="page-sub">One-off actual expenses. Deleted / closed months are read-only.</div>
      </div>
      <div class="row-flex">
        <label class="muted small" for="month-filter">Filter month</label>
        <input type="month" id="month-filter" />
        <button class="btn primary" id="add-var-btn">+ Add Expense</button>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Name</th><th>Type</th><th class="num">Amount</th><th>Remarks</th>
              <th class="num">Actions</th>
            </tr>
          </thead>
          <tbody id="var-tbody"></tbody>
        </table>
      </div>
      <div id="var-empty"></div>
    </div>
  </main>

  <dialog class="modal" id="var-modal">
    <div class="modal-head">
      <h3 id="var-modal-title">Add Expense</h3>
      <button class="btn ghost" data-close-var>&times;</button>
    </div>
    <div class="modal-body">
      <form id="var-form" class="form-grid" novalidate>
        <div class="form-row">
          <label for="var-name">Name</label>
          <input type="text" id="var-name" name="name" required maxlength="150" />
        </div>
        <div class="form-row two">
          <div class="form-row">
            <label for="var-type">Type</label>
            <select id="var-type" name="type"></select>
          </div>
          <div class="form-row">
            <label for="var-amount">Amount (RM)</label>
            <input type="number" id="var-amount" name="amount" min="0" step="0.01" required />
          </div>
        </div>
        <div class="form-row two">
          <div class="form-row">
            <label for="var-date">Date</label>
            <input type="date" id="var-date" name="expenseDate" required />
          </div>
          <div class="form-row">
            <label for="var-remarks">Remarks</label>
            <input type="text" id="var-remarks" name="remarks" maxlength="1000" />
          </div>
        </div>
        <p class="field-error" id="var-error"></p>
        <button type="submit" class="btn primary block">Save</button>
      </form>
    </div>
  </dialog>

  <script src="/js/ui.js"></script>
  <script src="/js/variable-expenses.js"></script>
</body>
</html>

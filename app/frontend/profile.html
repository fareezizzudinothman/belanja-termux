<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Belanja" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <title>Profile &middot; Belanja</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Profile</h1>
        <div class="page-sub">Your account details.</div>
      </div>
    </div>

    <div class="grid cols-2">
      <div class="card">
        <h2>Account</h2>
        <p class="muted small">Signed in as <strong id="p-email">&hellip;</strong></p>
        <form id="profile-form" class="form-grid" novalidate>
          <div class="form-row">
            <label for="p-name">Name</label>
            <input type="text" id="p-name" name="name" required maxlength="100" />
          </div>
          <p class="field-error" id="p-error"></p>
          <button type="submit" class="btn primary">Save name</button>
        </form>
      </div>
      <div class="card">
        <h2>Session</h2>
        <p class="small" style="margin:0;">
          You can log out of this device at any time.
        </p>
        <button class="btn danger" id="p-logout" style="margin-top:12px;">Logout</button>
        <hr style="border:none; border-top:1px solid var(--border); margin:20px 0;" />
        <div class="small muted">
          <div>Belanja &middot; personal monthly expense manager</div>
          <div>Member since <span id="p-member-since">&hellip;</span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/ui.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>

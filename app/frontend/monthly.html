<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Belanja" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <title>Monthly Expenses &middot; Belanja</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Monthly Expenses</h1>
        <div class="page-sub" id="month-sub">Loading&hellip;</div>
      </div>
      <div>
        <div class="row-flex" style="gap:8px; justify-content:flex-end;">
          <span class="badge idle" id="month-status">&hellip;</span>
          <div class="month-nav">
            <button class="btn small" id="prev-month" aria-label="Previous month">&larr;</button>
            <div class="month-title" id="month-title">&hellip;</div>
            <button class="btn small" id="next-month" aria-label="Next month">&rarr;</button>
            <button class="btn small" id="today-btn">Today</button>
          </div>
        </div>
      </div>
    </div>

    <div id="month-banner"></div>

    <div class="grid cols-2">
      <div class="card">
        <h2>Expected &mdash; Fixed Expenses <span class="badge type">recurring</span></h2>
        <div id="fixed-list"></div>
      </div>
      <div class="card">
        <h2>Expected &mdash; Installments <span class="badge type">recurring</span></h2>
        <div id="inst-list"></div>
      </div>
    </div>

    <div class="card">
      <div class="row-flex justify-between" style="margin-bottom:6px;">
        <h2 style="margin:0;">Actual &mdash; Variable Expenses</h2>
        <button class="btn primary small" id="add-var-btn" title="Add a one-off expense">+ Add Expense</button>
      </div>
      <div id="var-list"></div>
    </div>

    <div class="card" style="margin-top: 4px;">
      <div class="row-flex justify-between" style="flex-wrap:wrap; gap:14px;">
        <div style="flex:1; min-width:220px;">
          <div class="total-line"><span class="muted">Fixed</span><span id="sum-fixed"></span></div>
          <div class="total-line"><span class="muted">Installments</span><span id="sum-inst"></span></div>
          <div class="total-line"><span class="muted">Variable</span><span id="sum-var"></span></div>
        </div>
        <div style="min-width:200px; text-align:right;">
          <div class="label muted small">TOTAL MONTHLY EXPENSES</div>
          <div style="font-size:28px; font-weight:800;" id="sum-total">&hellip;</div>
          <div class="month-actions" style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
            <button class="btn primary" id="open-month-btn" data-label="Open Month" style="display:none;">Open Month</button>
            <button class="btn warn-block primary" id="close-month-btn" data-label="Close Month" style="display:none;">Close Month</button>
            <button class="btn primary" id="reopen-month-btn" data-label="Reopen Month" style="display:none;">Reopen Month</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <dialog class="modal" id="var-modal">
    <div class="modal-head">
      <h3 id="var-modal-title">Add Expense</h3>
      <button class="btn ghost" data-close-modal>&times;</button>
    </div>
    <div class="modal-body">
      <form id="var-form" class="form-grid" novalidate>
        <div class="form-row">
          <label for="var-name">Name</label>
          <input type="text" id="var-name" name="name" required maxlength="150" />
        </div>
        <div class="form-row two">
          <div class="form-row">
            <label for="var-type">Type</label>
            <select id="var-type" name="type"></select>
          </div>
          <div class="form-row">
            <label for="var-amount">Amount (RM)</label>
            <input type="number" id="var-amount" name="amount" min="0" step="0.01" required />
          </div>
        </div>
        <div class="form-row two">
          <div class="form-row">
            <label for="var-date">Date</label>
            <input type="date" id="var-date" name="expenseDate" required />
          </div>
          <div class="form-row">
            <label for="var-remarks">Remarks</label>
            <input type="text" id="var-remarks" name="remarks" maxlength="1000" />
          </div>
        </div>
        <p class="field-error" id="var-error"></p>
        <button type="submit" class="btn primary block">Save</button>
      </form>
    </div>
  </dialog>

  <script src="/js/ui.js"></script>
  <script src="/js/monthly.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Belanja" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <title>Installments &middot; Belanja</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Installments &amp; Loans</h1>
        <div class="page-sub">Remaining months are calculated automatically (<em>total &minus; paid</em>).</div>
      </div>
      <button class="btn primary" id="add-inst-btn">+ Add Installment</button>
    </div>

    <div class="grid" id="inst-cards"></div>
    <div id="inst-empty"></div>
  </main>

  <dialog class="modal" id="inst-modal">
    <div class="modal-head">
      <h3 id="inst-modal-title">Add Installment</h3>
      <button class="btn ghost" data-close-inst>&times;</button>
    </div>
    <div class="modal-body">
      <form id="inst-form" class="form-grid" novalidate>
        <div class="form-row">
          <label for="inst-loan">Loan / Item name</label>
          <input type="text" id="inst-loan" name="loanName" required maxlength="150" placeholder="e.g. iPad" />
        </div>
        <div class="form-row two">
          <div class="form-row">
            <label for="inst-type">Type</label>
            <select id="inst-type" name="type"></select>
          </div>
          <div class="form-row">
            <label for="inst-mo">Monthly installment (RM)</label>
            <input type="number" id="inst-mo" name="monthlyInstallment" min="0.01" step="0.01" required />
          </div>
        </div>
        <div class="form-row two">
          <div class="form-row">
            <label for="inst-total-amount">Total amount (RM)</label>
            <input type="number" id="inst-total-amount" name="amount" min="0" step="0.01" required />
          </div>
          <div class="form-row">
            <label for="inst-remarks">Remarks</label>
            <input type="text" id="inst-remarks" name="remarks" maxlength="1000" />
          </div>
        </div>
        <div class="form-row two">
          <div class="form-row">
            <label for="inst-total-months">Total months</label>
            <input type="number" id="inst-total-months" name="totalMonths" min="1" max="600" required />
          </div>
          <div class="form-row">
            <label for="inst-paid-months">Paid months</label>
            <input type="number" id="inst-paid-months" name="paidMonths" min="0" value="0" />
          </div>
        </div>
        <div class="form-row two">
          <div class="form-row">
            <label for="inst-start">Start date</label>
            <input type="date" id="inst-start" name="startDate" />
          </div>
          <div class="form-row">
            <label for="inst-end">End date <span class="muted">(optional)</span></label>
            <input type="date" id="inst-end" name="endDate" />
          </div>
        </div>
        <label class="row-flex" style="gap:8px;">
          <input type="checkbox" id="inst-active" name="active" checked style="width:auto;" />
          <span>Active (counted in open months)</span>
        </label>
        <p class="field-error" id="inst-error"></p>
        <button type="submit" class="btn primary block">Save</button>
      </form>
    </div>
  </dialog>

  <script src="/js/ui.js"></script>
  <script src="/js/installments.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Belanja" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <title>Register &middot; Belanja</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-body">
    <form class="card auth-card" id="register-form" novalidate>
      <div class="brand"><span class="dot"></span>Belanja</div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-sub">Track fixed, variable and installment expenses month by month.</p>

      <div class="form-grid">
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required maxlength="100" />
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
          <p class="hint">At least 8 characters.</p>
        </div>
        <button type="submit" class="btn primary block" id="register-btn">Create account</button>
        <p class="field-error" id="form-error"></p>
      </div>

      <p class="auth-footer">Already have an account? <a href="/login.html">Log in</a></p>
    </form>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
